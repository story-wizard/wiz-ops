<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress preview · Athanor</title>
<link rel="stylesheet" href="/wizard-tokens.css"><link rel="stylesheet" href="/smoke-theme.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 var(--font-ui)}main{max-width:1150px;margin:auto;padding:0 24px 36px}
.page-header{display:flex;align-items:center;margin-bottom:24px}h1{margin:0}h2{font-size:23px;margin:0 0 8px}h3{font-size:16px;color:#d7e5f3;margin:0 0 12px}
p{color:#a2b3c5;margin:0 0 20px}a{color:#8cbee7}label{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid #485768;border-radius:6px;cursor:pointer}
input{accent-color:#8cbee7}input[type=range]{width:180px}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls output{min-width:34px}
section{margin-top:20px;padding:22px 24px;background:#22282f;border:1px solid #3b4857;border-radius:7px}.palette{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 0;font-size:12px}
.progress-hero .ley-progress{height:58px}.progress-hero .steam-channel{height:40px;border-radius:22px}.progress-hero .outcome-scale{top:46px}.progress-hero .outcome-tick{width:3px;height:8px}.progress-hero .outcome-tick.major,.progress-hero .outcome-tick.leading{height:12px}.sample-row{display:grid;grid-template-columns:1fr minmax(260px,380px) auto;gap:24px;align-items:center;color:#b6c2cf;font-size:13px}
@media(max-width:760px){.sample-row{grid-template-columns:1fr}.controls{gap:8px}}
</style></head><body><main>
<header class="page-header"><h1 class="smoke-brand smoke-wordmark">Athanor</h1><img class="wizard-signature" src="/wizard-logo.svg" alt="Wizard" width="64" height="14"></header>
<h2>Progress preview</h2><p>The selected engraved ley scale, using the app’s shared renderer. Sample data.</p>
<div class="controls"><label>Progress <input id="progress" type="range" min="0" max="100" value="62"><output id="amount">62%</output></label><label><input id="advance" type="checkbox" checked>Advance progress</label><label><input id="still" type="checkbox">Show finished bars</label></div>
<div id="progress-preview"></div><p style="margin-top:24px"><a href="/#runs">Back to Results</a></p>
</main><script type="module" src="/design-preview.js"></script></body></html>
