<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcane pulse · Athanor</title>
  <link rel="stylesheet" href="/wizard-tokens.css"><link rel="stylesheet" href="/smoke-theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.6 var(--font-ui)}main{max-width:1000px;margin:auto;padding:0 24px 36px}
    .page-header{display:flex;align-items:center;margin-bottom:24px}h1{margin:0}h2{font-size:24px;margin:0 0 8px}
    p{color:#a2b3c5;margin:0 0 20px}a{color:#8cbee7}label{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid #485768;border-radius:6px;cursor:pointer}
    input{accent-color:#8cbee7}.controls{display:flex;gap:12px;flex-wrap:wrap}section{margin-top:22px;padding:24px;background:#232b34;border:1px solid #3b4857;border-radius:8px}
    .run-progress{margin:30px 0}.progress-fill{animation:demo-fill 20s linear -9s infinite}
    body:has(#advance:not(:checked)) .progress-fill{animation-play-state:paused}
    body:has(#still:checked) .smoke-head,body:has(#still:checked) .energy-edge{display:none}
    body:has(#still:checked) .progress-fill{animation:none;width:100%!important}
    body:has(#still:checked) .color-fill{mask-image:none}
    .caption{font-size:12px;color:#92a4b8;margin:10px 0 0}
    @keyframes demo-fill{0%,8%{width:10%}92%,100%{width:100%}}
    @media(max-width:600px){main{padding:0 16px 24px}section{padding:18px}}
  </style>
</head>
<body><main>
  <header class="page-header"><h1 class="smoke-brand smoke-wordmark">Athanor</h1><img class="wizard-signature" src="/wizard-logo.svg" alt="Wizard" width="64" height="14"></header>
  <h2>Arcane pulse</h2><p>The selected progress treatment: a turning spark with magical steam fading behind it.</p>
  <div class="controls"><label><input id="advance" type="checkbox" checked>Advance progress</label><label><input id="still" type="checkbox">Show finished bars</label></div>
  <section><div id="progress-preview" aria-hidden="true"></div><p class="caption">Design preview · Pass, fail, blocked and running colors stay the same.</p></section>
  <p style="margin-top:24px"><a href="/">Back to Athanor</a></p>
</main><script type="module" src="/design-preview.js"></script></body></html>
