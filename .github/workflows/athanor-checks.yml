name: Athanor framework checks
on:
  pull_request:
    paths: ['smoke/**', 'AGENTS.md', '.github/workflows/athanor-checks.yml']
  push:
    paths: ['smoke/**', 'AGENTS.md', '.github/workflows/athanor-checks.yml']
permissions:
  contents: read
jobs:
  framework:
    runs-on: macos-14
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run scope:check
